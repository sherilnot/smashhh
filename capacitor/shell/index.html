<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="color-scheme" content="dark">
  <title>Rizins Smash</title>
  <style>
    :root { --bg: #1a1a1a; --fg: #f5f5f5; --muted: #9a9a9a; --accent: #e8b23a; }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      padding: max(2rem, env(safe-area-inset-top)) 2rem max(2rem, env(safe-area-inset-bottom));
      text-align: center;
    }
    img.logo { width: 96px; height: 96px; border-radius: 22%; }
    h1 { margin: 0; font-size: 1.25rem; font-weight: 600; letter-spacing: 0.01em; }
    p { margin: 0; color: var(--muted); font-size: 0.95rem; line-height: 1.5; max-width: 28ch; }
    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid rgba(255, 255, 255, 0.15);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      .spinner { animation-duration: 3s; }
    }
  </style>
</head>
<body>
  <img class="logo" src="assets/logo.png" alt="Rizins Smash logo">
  <h1>Rizins Smash</h1>
  <div class="spinner" role="status" aria-label="Loading"></div>
  <p>Starting up. This screen only appears while the app is connecting.</p>
</body>
</html>
