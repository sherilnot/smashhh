<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="color-scheme" content="dark">
  <title>No connection</title>
  <style>
    :root { --bg: #1a1a1a; --fg: #f5f5f5; --muted: #9a9a9a; --accent: #e8b23a; }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.25rem;
      padding: max(2rem, env(safe-area-inset-top)) 2rem max(2rem, env(safe-area-inset-bottom));
      text-align: center;
    }
    img.logo { width: 80px; height: 80px; border-radius: 22%; opacity: 0.85; }
    h1 { margin: 0; font-size: 1.3rem; font-weight: 600; }
    p { margin: 0; color: var(--muted); font-size: 0.95rem; line-height: 1.55; max-width: 32ch; }
    button {
      margin-top: 0.5rem;
      min-height: 48px;
      padding: 0 2rem;
      font: inherit;
      font-weight: 600;
      color: #1a1a1a;
      background: var(--accent);
      border: none;
      border-radius: 12px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    button:active { opacity: 0.8; }
    button:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
    #status { min-height: 1.2em; font-size: 0.85rem; color: var(--muted); }
  </style>
</head>
<body>
  <img class="logo" src="assets/logo.png" alt="Rizins Smash logo">
  <h1>Can&rsquo;t reach the server</h1>
  <p>Check your internet connection and try again. Your shifts and timesheets are safe.</p>
  <button id="retry" type="button">Try again</button>
  <p id="status" role="status" aria-live="polite"></p>

  <!-- Generated by scripts/build-capacitor-shell.js; defines window.__APP_URL__ -->
  <script src="assets/config.js"></script>
  <script>
    // This page is served from the app bundle at capacitor://localhost, so
    // reloading window.location would just redisplay this screen. The deployed
    // URL is injected at build time instead: the native bridge's
    // Capacitor.getServerUrl() returns the local scheme, not the remote server.
    (function () {
      var retry = document.getElementById('retry');
      var status = document.getElementById('status');
      var appUrl = typeof window.__APP_URL__ === 'string' ? window.__APP_URL__ : '';

      if (!appUrl) {
        // Should never happen in a properly built binary, but never leave the
        // user staring at a button that silently does nothing.
        retry.disabled = true;
        status.textContent = 'App is misconfigured. Please reinstall.';
        return;
      }

      retry.addEventListener('click', function () {
        status.textContent = 'Reconnecting\u2026';
        retry.disabled = true;

        // Cache-bust so WKWebView re-attempts the network request instead of
        // replaying the cached failure.
        window.location.replace(appUrl + '/?_r=' + Date.now());

        // If the navigation did not take (still offline), re-enable the button so
        // the user is not stranded on a dead screen.
        setTimeout(function () {
          retry.disabled = false;
          status.textContent = 'Still offline. Try again in a moment.';
        }, 6000);
      });
    })();
  </script>
</body>
</html>
